<!DOCTYPE html>
<!--
  Japan GroundLink — B2B 地面交通 Demo 首页
  所有可见文字都来自 i18n/*.js:元素上的 data-i18n="键" 会在加载时被替换。
    data-i18n="键"            → 整段文字
    data-i18n-part="0|1"      → 文字含 "标题|说明" 时取第几段
    data-i18n-ph="键"         → 输入框 placeholder
    data-pax="5"              → 使用 fleet.pax 并把 {n} 换成数字
    data-site="email"         → 来自 data/site.js 的公司资料
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Japan GroundLink</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/emblem.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/premium.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ① 顶部导航 + 语言选择 -->
<header class="site-header">
  <div class="bar">
    <a class="logo" href="#top" aria-label="Japan GroundLink"><img src="assets/logo/logo-light.svg" alt="Japan GroundLink · B2B Ground Transport" width="263" height="60"></a>
    <nav class="main-nav">
      <a href="#why" data-i18n="nav.why"></a>
      <a href="#rates" data-i18n="nav.rates"></a>
      <a href="#fleet" data-i18n="nav.fleet"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#apply" data-i18n="nav.contact"></a>
    </nav>
    <select id="lang-select" aria-label="Language"></select>
    <a class="btn btn-gold nav-cta" href="#apply" data-i18n="nav.enquiry"></a>
  </div>
</header>

<!-- ② 首屏 Hero:左文案 + 右图 -->
<section class="hero" id="top">
  <div class="wrap hero-grid">
    <div class="hero-copy">
      <span class="badge" data-i18n="hero.badge"></span>
      <p class="eyebrow" data-i18n="hero.explore"></p>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.text"></p>
      <div class="hero-cta">
        <a class="btn btn-gold" href="#apply" data-i18n="hero.cta"></a>
        <a class="btn btn-outline" href="#why" data-i18n="hero.cap"></a>
      </div>
      <p class="hero-sub" data-i18n="hero.sub"></p>
    </div>
    <a class="hero-card" href="#fleet" aria-label="Fleet">
      <span class="hc-label" data-i18n="hero.card"></span>
      <span class="hc-car"><img src="assets/images/fleet/alphard-side.jpg" alt="Toyota Alphard"><span class="hc-row"><b>Alphard</b><small data-i18n="fleet.fullpax" data-pax="5"></small></span></span>
      <span class="hc-car"><img src="assets/images/fleet/hiace-side.jpg" alt="Toyota HiAce"><span class="hc-row"><b>HiAce</b><small data-i18n="fleet.fullpax" data-pax="9"></small></span></span>
    </a>
  </div>
</section>

<!-- ③ 信任栏 -->
<div class="trust">
  <div class="wrap trust-list">
    <span>✓ <b data-i18n="trust.1"></b></span><span>✓ <b data-i18n="trust.2"></b></span>
    <span>✓ <b data-i18n="trust.3"></b></span><span>✓ <b data-i18n="trust.4"></b></span>
  </div>
</div>

<!-- ④ 合作优势 6 项 + 客户保护 -->
<section id="why">
  <div class="wrap">
    <h2 data-i18n="why.title"></h2>
    <div class="grid grid-why">
      <article class="card"><i class="num">01</i><h3 data-i18n="why.1" data-i18n-part="0"></h3><p data-i18n="why.1" data-i18n-part="1"></p></article>
      <article class="card"><i class="num">02</i><h3 data-i18n="why.2" data-i18n-part="0"></h3><p data-i18n="why.2" data-i18n-part="1"></p></article>
      <article class="card"><i class="num">03</i><h3 data-i18n="why.3" data-i18n-part="0"></h3><p data-i18n="why.3" data-i18n-part="1"></p></article>
      <article class="card"><i class="num">04</i><h3 data-i18n="why.4" data-i18n-part="0"></h3><p data-i18n="why.4" data-i18n-part="1"></p></article>
      <article class="card"><i class="num">05</i><h3 data-i18n="why.5" data-i18n-part="0"></h3><p data-i18n="why.5" data-i18n-part="1"></p></article>
      <article class="card"><i class="num">06</i><h3 data-i18n="why.6" data-i18n-part="0"></h3><p data-i18n="why.6" data-i18n-part="1"></p></article>
    </div>
    <div class="callout"><h3 data-i18n="protect" data-i18n-part="0"></h3><p data-i18n="protect" data-i18n-part="1"></p></div>
  </div>
</section>

<!-- ⑤ 服务(图标取自上传图片) -->
<section class="alt" id="services">
  <div class="wrap">
    <h2 data-i18n="nav.services"></h2>
    <div class="grid grid-svc">
      <div class="svc"><img src="assets/images/ic1.jpg" alt=""><b data-i18n="svc.1" data-i18n-part="0"></b><span data-i18n="svc.1" data-i18n-part="1"></span></div>
      <div class="svc"><img src="assets/images/ic2.jpg" alt=""><b data-i18n="svc.2" data-i18n-part="0"></b><span data-i18n="svc.2" data-i18n-part="1"></span></div>
      <div class="svc"><img src="assets/images/ic3.jpg" alt=""><b data-i18n="svc.3" data-i18n-part="0"></b><span data-i18n="svc.3" data-i18n-part="1"></span></div>
      <div class="svc"><img src="assets/images/ic4.jpg" alt=""><b data-i18n="svc.4" data-i18n-part="0"></b><span data-i18n="svc.4" data-i18n-part="1"></span></div>
      <div class="svc"><img src="assets/images/ic5.jpg" alt=""><b data-i18n="svc.5" data-i18n-part="0"></b><span data-i18n="svc.5" data-i18n-part="1"></span></div>
    </div>
  </div>
</section>

<!-- ⑥ B2B 参考净价估算(演示;数据在 data/rates.js) -->
<section id="rates">
  <div class="wrap narrow">
    <h2 data-i18n="rates.title"></h2>
    <!-- 三个标签:机场接送 / 点对点 / 10 小时包车(js/rates.js 控制显示哪些输入项) -->
    <div class="tabs" id="rate-tabs">
      <button data-t="airport" class="on" data-i18n="rates.tab.airport"></button>
      <button data-t="p2p" data-i18n="rates.tab.p2p"></button>
      <button data-t="charter" data-i18n="rates.tab.charter"></button>
    </div>
    <div class="rate-box">
      <label id="r-route"><span data-i18n="rates.route"></span><select id="rate-route"></select></label>
      <label id="r-dir"><span data-i18n="rates.dir"></span>
        <select id="rate-dir"><option value="pickup" data-i18n="rates.dir.pickup"></option><option value="dropoff" data-i18n="rates.dir.dropoff"></option></select></label>
      <label id="r-km" hidden><span data-i18n="rates.km"></span><input id="rate-km" type="number" min="1" value="30"></label>
      <label id="r-car"><span data-i18n="rates.car"></span><select id="rate-car"></select></label>
      <label id="r-board" class="check"><input type="checkbox" id="rate-board"> <span data-i18n="rates.board"></span></label>
      <label id="r-seat"><span data-i18n="rates.seat"></span><input id="rate-seat" type="number" min="0" max="4" value="0"></label>
      <div class="rate-out"><small data-i18n="rates.price"></small><strong id="rate-price">—</strong><em id="rate-tag"></em></div>
    </div>
    <p class="note" id="rate-cap"></p>
    <p class="note ok-line" data-i18n="rates.included"></p>
    <p class="note" data-i18n="rates.note"></p>
    <p class="center"><a class="btn" href="#apply" data-i18n="hero.cta"></a></p>
  </div>
</section>

<!-- ⑦ 灵活服务 -->
<section class="band-light">
  <div class="wrap narrow center"><h2 data-i18n="flex" data-i18n-part="0"></h2><p class="lead" data-i18n="flex" data-i18n-part="1"></p></div>
</section>

<!-- ⑧ 车队:Alphard / HiAce 展示(图片取自客户提供的两张车型图,裁剪在 assets/images/fleet/);Coaster / Bus 沿用原图 -->
<section class="alt fleet" id="fleet">
  <div class="wrap">
    <p class="kicker" data-i18n="fleet.eyebrow"></p>
    <h2 data-i18n="fleet.title"></h2>
    <p class="sec-sub" data-i18n="fleet.sub"></p>
    <div class="fleet-tabs" id="fleet-tabs" role="tablist">
      <button type="button" role="tab" class="on" data-f="alphard" data-i18n="fleet.tab.alphard"></button>
      <button type="button" role="tab" data-f="hiace" data-i18n="fleet.tab.hiace"></button>
    </div>
    <article class="showcase" data-f="alphard">
      <div class="gal">
        <figure class="gal-main" tabindex="0" aria-label="Click to enlarge"><span class="zoom-hint" data-i18n="fleet.zoom"></span><span class="lens" hidden></span><img src="assets/images/fleet/alphard-front.jpg" alt="Toyota Alphard 3rd generation front"><figcaption data-i18n="fleet.v.front"></figcaption></figure>
        <div class="thumbs"><button type="button" class="th on" data-src="assets/images/fleet/alphard-front.jpg" data-cap="fleet.v.front"><img src="assets/images/fleet/alphard-front.jpg" alt="Toyota Alphard 3rd generation front" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/vellfire-front.jpg" data-cap="fleet.v.front"><img src="assets/images/fleet/vellfire-front.jpg" alt="Toyota Vellfire 3rd generation front" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/alphard-seats.jpg" data-cap="fleet.v.cabin"><img src="assets/images/fleet/alphard-seats.jpg" alt="Alphard second-row seats" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/alphard-rear.jpg" data-cap="fleet.v.rear"><img src="assets/images/fleet/alphard-rear.jpg" alt="Alphard rear seats" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/alphard-trunk.jpg" data-cap="fleet.v.cargo"><img src="assets/images/fleet/alphard-trunk.jpg" alt="Alphard luggage space" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/alphard-side.jpg" data-cap="fleet.v.side"><img src="assets/images/fleet/alphard-side.jpg" alt="Alphard side view" loading="lazy"></button></div>
      </div>
      <div class="spec">
        <div class="big"><b>7</b><span data-i18n="fleet.seater"></span></div>
        <h3 data-i18n="fleet.tab.alphard"></h3>
        <p class="desc" data-i18n="fleet.alphard.desc"></p>
        <div class="full-load">
          <small data-i18n="fleet.full"></small>
          <div class="fl-row"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.2"/><path d="M6 21v-7a6 6 0 0 1 12 0v7h-3.2v-6h-.8v6h-4v-6h-.8v6z"/></svg><span data-i18n="fleet.fullpax" data-pax="5"></span></div>
          <div class="fl-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3h-1.6V4.6H9.6V6H8zM6 7h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-.6v1h-1.6v-1H8.8v1H7.2v-1H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm2.2 2.6v7.8h1.6V9.6zm6 0v7.8h1.6V9.6z"/></svg><span data-i18n="fleet.fullbag" data-pax="5"></span></div>
        </div>
        <p class="models" data-i18n="fleet.models"></p>
        <p class="fine" data-i18n="fleet.note.alphard"></p>
        <a class="btn btn-gold" href="#rates" data-car="0" data-i18n="fleet.quote"></a>
      </div>
    </article>
    <article class="showcase" data-f="hiace" hidden>
      <div class="gal">
        <figure class="gal-main" tabindex="0" aria-label="Click to enlarge"><span class="zoom-hint" data-i18n="fleet.zoom"></span><span class="lens" hidden></span><img src="assets/images/fleet/hiace-front.jpg" alt="Toyota HiAce front"><figcaption data-i18n="fleet.v.front"></figcaption></figure>
        <div class="thumbs"><button type="button" class="th on" data-src="assets/images/fleet/hiace-front.jpg" data-cap="fleet.v.front"><img src="assets/images/fleet/hiace-front.jpg" alt="Toyota HiAce front" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/hiace-34.jpg" data-cap="fleet.v.34"><img src="assets/images/fleet/hiace-34.jpg" alt="Toyota HiAce three-quarter view" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/hiace-in1.jpg" data-cap="fleet.v.cabin"><img src="assets/images/fleet/hiace-in1.jpg" alt="HiAce cabin" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/hiace-in2.jpg" data-cap="fleet.v.rear"><img src="assets/images/fleet/hiace-in2.jpg" alt="HiAce rear seats" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/hiace-trunk.jpg" data-cap="fleet.v.cargo"><img src="assets/images/fleet/hiace-trunk.jpg" alt="HiAce luggage space" loading="lazy"></button><button type="button" class="th" data-src="assets/images/fleet/hiace-side.jpg" data-cap="fleet.v.side"><img src="assets/images/fleet/hiace-side.jpg" alt="HiAce side view" loading="lazy"></button></div>
      </div>
      <div class="spec">
        <div class="big"><b>10</b><span data-i18n="fleet.seater"></span></div>
        <h3 data-i18n="fleet.tab.hiace"></h3>
        <p class="desc" data-i18n="fleet.hiace.desc"></p>
        <div class="full-load">
          <small data-i18n="fleet.full"></small>
          <div class="fl-row"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.2"/><path d="M6 21v-7a6 6 0 0 1 12 0v7h-3.2v-6h-.8v6h-4v-6h-.8v6z"/></svg><span data-i18n="fleet.fullpax" data-pax="9"></span></div>
          <div class="fl-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3h-1.6V4.6H9.6V6H8zM6 7h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-.6v1h-1.6v-1H8.8v1H7.2v-1H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm2.2 2.6v7.8h1.6V9.6zm6 0v7.8h1.6V9.6z"/></svg><span data-i18n="fleet.fullbag" data-pax="9"></span></div>
        </div>
        
        
        <a class="btn btn-gold" href="#rates" data-car="1" data-i18n="fleet.quote"></a>
      </div>
    </article>
    <h3 class="more-h" data-i18n="fleet.more"></h3>
    <div class="grid grid-more">
      <div class="fleet-card"><img src="assets/images/v3.jpg" alt="Toyota Coaster"><div class="pill"><b>Coaster</b><small data-i18n="fleet.pax" data-pax="20"></small></div></div>
      <div class="fleet-card"><img src="assets/images/v4.jpg" alt="Bus Grande"><div class="pill"><b>Bus Grande</b><small data-i18n="fleet.pax" data-pax="49"></small></div></div>
    </div>
  </div>
</section>

<!-- ⑨ 目的地(拍立得风格) -->
<section id="destinations">
  <div class="wrap">
    <h2 data-i18n="dest.title"></h2>
    <div class="grid grid-dest">
      <figure class="polaroid"><img src="assets/images/d1.jpg" alt="Mount Fuji"><figcaption>Mount Fuji</figcaption></figure>
      <figure class="polaroid"><img src="assets/images/d2.jpg" alt="Pagoda Chureito"><figcaption>Pagoda Chureito</figcaption></figure>
      <figure class="polaroid"><img src="assets/images/d3.jpg" alt="Oshino Hakkai"><figcaption>Oshino Hakkai</figcaption></figure>
      <figure class="polaroid"><img src="assets/images/d4.jpg" alt="Oishi Park"><figcaption>Oishi Park</figcaption></figure>
      <figure class="polaroid"><img src="assets/images/d5.jpg" alt="Lake Kawaguchiko Shopping Center"><figcaption>Lake Kawaguchiko Shopping Center</figcaption></figure>
      <figure class="polaroid"><img src="assets/images/d6.jpg" alt="Tokyo"><figcaption>Tokyo</figcaption></figure>
    </div>
  </div>
</section>

<!-- ⑩ 品牌口号带 -->
<div class="band"><div class="band-title" data-i18n="band.tags"></div><p data-i18n="band.tag"></p></div>

<!-- ⑪ 合作流程 3 步 -->
<section id="process">
  <div class="wrap">
    <h2 data-i18n="nav.process"></h2>
    <div class="grid grid-proc">
      <article class="card step"><i class="num">01</i><h3 data-i18n="proc.1" data-i18n-part="0"></h3><p data-i18n="proc.1" data-i18n-part="1"></p></article>
      <article class="card step"><i class="num">02</i><h3 data-i18n="proc.2" data-i18n-part="0"></h3><p data-i18n="proc.2" data-i18n-part="1"></p></article>
      <article class="card step"><i class="num">03</i><h3 data-i18n="proc.3" data-i18n-part="0"></h3><p data-i18n="proc.3" data-i18n-part="1"></p></article>
    </div>
  </div>
</section>

<!-- ⑫ 联系 + B2B 申请表(演示:不会发送数据) -->
<section class="alt" id="apply">
  <div class="wrap narrow">
    <h2 data-i18n="apply.title"></h2>
    <!-- 联系方式:邮箱、Instagram、WhatsApp Business 二维码(资料在 data/site.js) -->
    <div class="contact-card">
      <ul class="contact-info">
        <li>✉ <span data-i18n="contact.email"></span>: <a data-site="email"></a></li>
        <li>◎ Instagram: <a data-site="instagram" target="_blank" rel="noopener"></a></li>
        <li>☎ <span data-site="whatsapp"></span></li>
        <li>⌂ <span data-site="address"></span></li><li>§ <span data-site="license"></span></li>
      </ul>
      <div class="qrs">
        <figure><img src="assets/images/qr-whatsapp.png" alt="WhatsApp Business QR · Hikari"><figcaption>WhatsApp · <span data-i18n="contact.scan"></span></figcaption></figure>
        <figure><img src="assets/images/qr-instagram.png" alt="Instagram QR · @JAPANPRIVATETRANSPORT"><figcaption>Instagram · <span data-i18n="contact.scan"></span></figcaption></figure>
      </div>
    </div>
    <div class="form">
      <input id="f-company" data-i18n-ph="apply.company"><input id="f-country" data-i18n-ph="apply.country">
      <input id="f-contact" data-i18n-ph="apply.contact"><input id="f-email" data-i18n-ph="apply.email">
      <input id="f-volume" class="full" data-i18n-ph="apply.volume">
      <label class="full check"><input type="checkbox" id="f-consent"> <span data-i18n="apply.consent"></span></label>
      <div class="full center"><button class="btn" id="f-send" data-i18n="apply.send"></button></div>
    </div>
    <div id="form-status" class="status"></div>
  </div>
</section>

<!-- ⑬ 页脚 -->
<footer class="site-footer">
  <img class="foot-logo" src="assets/logo/logo-dark.svg" alt="Japan GroundLink · B2B Ground Transport" width="317" height="72">
  <div class="discover"><i></i><span data-i18n="footer.discover"></span><i></i></div>
  <p data-i18n="footer.note"></p>
  <p class="copy">© Japan GroundLink · Demo</p>
</footer>

<!-- 车辆图片放大查看(js/fleet.js):滚轮/按钮缩放,拖动平移,←→ 切换,Esc 关闭 -->
<div id="lb" class="lb" hidden role="dialog" aria-modal="true">
  <div class="lb-stage"><img id="lb-img" alt="" draggable="false"></div>
  <div class="lb-bar">
    <button type="button" id="lb-prev" aria-label="Previous">‹</button>
    <button type="button" id="lb-out" aria-label="Zoom out">−</button>
    <span id="lb-z">100%</span>
    <button type="button" id="lb-in" aria-label="Zoom in">＋</button>
    <button type="button" id="lb-reset" aria-label="Reset">⟲</button>
    <button type="button" id="lb-next" aria-label="Next">›</button>
    <button type="button" id="lb-x" aria-label="Close">✕</button>
  </div>
  <p class="lb-cap" id="lb-cap"></p>
</div>

<!-- 脚本加载顺序:数据 → 翻译 → 逻辑 -->
<script src="data/site.js"></script>
<script src="data/rates.js"></script>
<script src="i18n/en.js"></script><script src="i18n/zh-CN.js"></script><script src="i18n/zh-TW.js"></script><script src="i18n/ja.js"></script>
<script src="js/i18n.js"></script>
<script src="js/rates.js"></script>
<script src="js/fleet.js"></script>
<script src="js/main.js"></script>
</body>
</html>
