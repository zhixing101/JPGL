<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" role="img" aria-label="Japan GroundLink · B2B Ground Transport">
<g transform="translate(0 2) scale(.96)">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8d19a"/><stop offset="1" stop-color="#b48c4c"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143a6b"/><stop offset="1" stop-color="#091a33"/></linearGradient>
    <clipPath id="c"><rect x="7.5" y="7.5" width="81" height="81" rx="18.5"/></clipPath>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="83" height="83" rx="19.5" fill="none" stroke="url(#g)" stroke-width="2"/>
  <g clip-path="url(#c)">
    <!-- 日轮 -->
    <circle cx="48" cy="36" r="17" fill="#d8453b"/>
    <!-- 富士山 -->
    <path d="M4 68 L38.5 33.5 Q48 26 57.5 33.5 L92 68 Z" fill="#f4f1ea"/>
    <path d="M38.5 33.5 Q48 26 57.5 33.5 L53.5 36.8 L50 34.6 L47 38 L44 34.8 L42 37.2 Z" fill="#fff"/>
    <path d="M4 68 L29 43 L36 49 L41 44 L45 51 L48 45 L52 52 L57 45 L62 50 L67 45 L92 68 Z" fill="#6f95c8" opacity=".6"/>
    <!-- 通向山脚的公路(透视) -->
    <path d="M44 68 L52 68 L74 92 L22 92 Z" fill="url(#g)"/>
    <path d="M47.4 69 L48.6 69 L51.6 92 L44.4 92 Z" fill="#0b2342"/>
    <path d="M47.65 71 h.7 l.55 5 h-1.8z M47.3 80 h1.4 l.9 7 h-3.2z" fill="url(#g)"/>
  </g>
  <!-- 链环:两个相扣的环 = Link / 合作 -->
  <g fill="none" stroke="url(#g)" stroke-width="3.2">
    <rect x="36" y="9.6" width="14" height="8" rx="4"/>
    <rect x="46" y="9.6" width="14" height="8" rx="4"/>
  </g>
</g>
<text x="106" y="35" font-family="Georgia,'Times New Roman',serif" font-size="17" letter-spacing="10" fill="#4a5b75" font-weight="700">JAPAN</text>
<text x="104" y="71" font-family="Georgia,'Times New Roman',serif" font-size="42" font-weight="700" fill="#0a1d38" letter-spacing=".5">Ground<tspan fill="#c4a265">Link</tspan></text>
<rect x="106" y="78" width="40" height="17" rx="3.5" fill="#c4a265"/>
<text x="126" y="91" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#0a1d38">B2B</text>
<text x="154" y="91" font-family="Arial,Helvetica,sans-serif" font-size="11.5" letter-spacing="3.4" fill="#4a5b75" font-weight="700">GROUND TRANSPORT</text>
</svg>